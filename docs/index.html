<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="inputContainer">
            <input type="file" name="inputfile" id="inputFile">
            <input type="file" name="secFile" id="secFile">


            <label for="opti">Eliminar subtítulos espúreos. <input type="checkbox" id="opti">
            </label>

            <label for="persistence" id="persistenceLabel">Persistencia (segundos):<input type="number" id="persistence"
                    disabled min="1">
            </label>


            <label for="espureo" id="espureoLabel">Ventana de subtitulo espúreo (milisegundos):<input type="number"
                    id="espureo" step="100" disabled min="200" max="1500" value="1000">
            </label>


            <label for="colorA">Color idioma superior:
                <input type="color" id="colorA" value="#ffffff">
            </label>


            <label for="colorB">Color idioma inferior:
                <input type="color" id="colorB" value="#ffffff"> </label>


            <label for="codA">Codificación del idioma A:
                <select name="codificacionA" id="codA">
                    <option value="utf-8" selected>UTF-8</option>
                    <option value="windows-1252">Windows 1252</option>
                    <option value="iso-8859-1">ISO 8859-1</option>
                </select>
            </label>


            <label for="codB">Codificación del idioma B:
                <select name="codificacionB" id="codB">
                    <option value="utf-8" selected>UTF-8</option>
                    <option value="windows-1252">Windows 1252</option>
                    <option value="iso-8859-1">ISO 8859-1</option>
                </select>
            </label>


            <button type="button" id="mergeButton">Merge</button>
            <a href="" id="descarga">Descarga</a>

            
        </div>
        

        <pre id="output"></pre>
        <pre id="secOutPut"></pre>
        <pre id="thirdOutPut"></pre>

    </div>
    <script type="module" src="script.js">

    </script>

</body>

</html>
