<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="inputContainer">
            <input type="file" name="inputfile" id="inputFile">
            <input type="file" name="secFile" id="secFile">


            <label for="opti">Modo optimizado.<input type="checkbox" id="opti">
            </label>

            <label for="prioridadSuperior"><input type="radio" id="prioridadSuperior" name="prioridad" value="prioridadSuperior" disabled checked>Prioridad de los subtítulos superiores</label>
            <label for="prioridadInferior"><input type="radio" id="prioridadInferior" name="prioridad" value="prioridadInferior" disabled>Prioridad de los subtítulos inferiores</label>
            <label for="prioridadMaximizar"><input type="radio" id="prioridadMaximizar" name="prioridad" value="prioridadMaximizar" disabled>Maximizar tiempo</label>
            <label for="prioridadMinimizar"><input type="radio" id="prioridadMinimizar" name="prioridad" value="prioridadMinimizar" disabled>Minimizar tiempo</label>

            <label for="persistence" id="persistenceLabel">Persistencia (segundos):<input type="number" id="persistence"
                    disabled min="1">
            </label>

            <label for="colorA">Color idioma superior:
                <input type="color" id="colorA" value="#ffffff">
            </label>


            <label for="colorB">Color idioma inferior:
                <input type="color" id="colorB" value="#ffffff"> </label>


            <label for="codA">Codificación del idioma A:
                <select name="codificacionA" id="codA">
                    <option value="utf-8" selected>UTF-8</option>
                    <option value="windows-1252">Windows 1252</option>
                    <option value="iso-8859-1">ISO 8859-1</option>
                </select>
            </label>


            <label for="codB">Codificación del idioma B:
                <select name="codificacionB" id="codB">
                    <option value="utf-8" selected>UTF-8</option>
                    <option value="windows-1252">Windows 1252</option>
                    <option value="iso-8859-1">ISO 8859-1</option>
                </select>
            </label>


            <button type="button" id="mergeButton">Merge</button>
            <a href="" id="descarga">Descarga</a>


        </div>


        <pre id="output"></pre>
        <pre id="secOutPut"></pre>
        <pre id="thirdOutPut"></pre>

    </div>
    <script type="module" src="script.js">

    </script>

</body>

</html>
