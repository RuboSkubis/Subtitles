<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <input type="file" name="inputfile" id="inputfile">
    <input type="file" name="secFile" id="secFile">

    <button type="button" id="mergeButton">Merge</button>



    <input type="checkbox" id="opti">
    <label for="opti">Eliminar subtítulos solitarios.</label>

    <label for="persistence" id="persistenceLabel" >Persistencia (segundos):</label>
    <input type="number" id="persistence" disabled>

    <label for="espureo" id="espureoLabel">Milisegundos de la ventana de subtitulo espúreo 
        (se recomienda un valor de entre 1000 y 1500, siendo preferible 1000)</label>
    <input type="number" id="espureo" step="100" disabled>

    <label for="colorA">Color idioma superior: </label>
    <input type="color" id="colorA" value="#ffffff">

    <label for="colorB">Color idioma inferior: </label>
    <input type="color" id="colorB" value="#ffffff">


    <a href="" hidden id="descarga">Descarga</a>



    <br>
    <div id="container">
        <pre id="output"></pre>
        <pre id="secOutPut"></pre>
        <pre id="thirdOutPut"></pre>
        <pre id="forthOutPut"></pre>
    </div>
    <script type="text/javascript" src="script.js">

    </script>

</body>

</html>
